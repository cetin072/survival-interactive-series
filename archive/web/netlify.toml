[build]
command = "npm run build:verified"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Production is intentionally cost-gated. Ordinary main merges are accumulated
# and only the commit that itself changes the release marker may create a Production deploy.
# Compare the current commit to its first parent, not the last successful deploy: a failed
# release must never let a later A/A-Wiki/B/C/UI merge inherit the old marker change.
# Netlify ignore commands exit 0 to skip and 1 to continue.
[context.production]
  ignore = "git diff --quiet $COMMIT_REF^1 $COMMIT_REF -- public/release/production.json"

# Archive content lives outside this site's base directory. Keep Preview builds
# when the Reader inputs or build scripts change.
[context.deploy-preview]
# Rebuilt proposal branches must get a new Preview even when their content matches the old cached ref.
  ignore = "git merge-base --is-ancestor $CACHED_COMMIT_REF $COMMIT_REF && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':(top)archive/content' ':(top)archive/web' ':(top)archive/scripts'"

[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://jgsxpdflgkqroecfjzxq.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/operator"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/operator/*"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/operator*"

  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "no-cache"
