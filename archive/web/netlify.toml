[build]
command = "node ../scripts/scheduled-netlify-release.mjs guard ../automation/release-policy.json && npm run build:verified"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Ordinary main builds are skipped. The scheduled Git Build Hook bypasses ignore,
# so build.command also validates its exact SHA, fixed slot and fresh payload.
[context.production]
  ignore = "node ../scripts/scheduled-netlify-release.mjs ignore"

# Archive content lives outside this site's base directory. Keep Preview builds
# when the Reader inputs or build scripts change.
# Persistent QA branch deploy only. Never publish this noindex header in production.
# Netlify Branch Deploys must be enabled for exactly "qa-preview" in the site UI.
[context.qa-preview]
  command = "npm run build:verified && cp qa-noindex.headers dist/_headers"

# BAG-SIDE-01 fixed manual QA. Enable this exact branch alongside qa-preview
# in Netlify Branch Deploys; no production build, new site, or per-commit promotion.
[context.qa-bag-side]
  command = "npm run build:verified && cp qa-noindex.headers dist/_headers"

[context.deploy-preview]
# Rebuilt proposal branches must get a new Preview even when their content matches the old cached ref.
  ignore = "git merge-base --is-ancestor $CACHED_COMMIT_REF $COMMIT_REF && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':(top)archive/content' ':(top)archive/web' ':(top)archive/scripts'"

[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://jgsxpdflgkqroecfjzxq.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/operator"
  to = "/index.html"
  status = 200
  force = true

# Knowledge's validated content contract supports HTTPS images and YouTube.
# Keep executable code, connections and Operator's policy restricted as before.
[[headers]]
  for = "/knowledge/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://jgsxpdflgkqroecfjzxq.supabase.co; img-src 'self' data: https:; frame-src https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"

[[redirects]]
  from = "/operator/*"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/operator*"

  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "no-cache"
