name: Temporary Linked Preview GM Smoke

on:
  push:
    branches:
      - feature/ai-gm-deepseek-provider
    paths:
      - '.github/workflows/linked-preview-gm-smoke.yml'
      - 'engine/web/src/runtime/previewLiveSmoke.test.ts'

jobs:
  live-preview-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/web/package-lock.json
      - name: Install
        working-directory: engine/web
        run: npm ci
      - name: Run one live free-action diagnostic
        working-directory: engine/web
        env:
          PREVIEW_GM_URL: https://deploy-preview-67--survival-zero-ai-test.netlify.app
        run: npx vitest run src/runtime/previewLiveSmoke.test.ts --reporter=verbose
