name: Prepare Knowledge semantic job

on:
  schedule:
    # Fallback for the primary Supabase external dispatcher (05:45/17:45 KST).
    - cron: '50 20 * * *'
    - cron: '50 8 * * *'
  workflow_dispatch:
    inputs:
      dispatch_origin:
        description: Scheduler origin
        required: false
        default: manual
      experience_seed_ref:
        description: Explicit EX-001 Seed path for the one-off pilot; leave blank for normal C-PREP
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: knowledge-semantic-prep
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require server-only credentials
        env:
          ARCHIVE_GITHUB_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_GITHUB_TOKEN" || { echo "ARCHIVE_GITHUB_TOKEN_REQUIRED"; exit 1; }
          test -n "$ARCHIVE_SUPABASE_URL" || { echo "ARCHIVE_SUPABASE_URL_REQUIRED"; exit 1; }
          test -n "$ARCHIVE_SUPABASE_SERVICE_ROLE_KEY" || { echo "ARCHIVE_SUPABASE_SERVICE_ROLE_KEY_REQUIRED"; exit 1; }

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: archive/web/package-lock.json

      - name: Validate repository Knowledge state
        working-directory: archive/web
        run: |
          npm ci
          npm run knowledge:test
          npm run knowledge:check

      - name: Prepare one durable semantic job
        if: inputs.experience_seed_ref == ''
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: node archive/scripts/knowledge-semantic-prepare.mjs

      - name: Prepare EX-001 experience job
        if: inputs.experience_seed_ref != ''
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
          EXPERIENCE_SEED_REF: ${{ inputs.experience_seed_ref }}
        run: node archive/scripts/knowledge-semantic-prepare-experience.mjs "$EXPERIENCE_SEED_REF"

      - name: Submit EX-001 for existing C3 finalizer
        if: inputs.experience_seed_ref != ''
        env:
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: node archive/scripts/knowledge-semantic-submit-experience.mjs
