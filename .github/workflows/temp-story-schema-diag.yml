name: Temporary Story Schema Diagnostic

on:
  push:
    branches:
      - feature/ai-gm-deepseek-provider
    paths:
      - '.github/workflows/temp-story-schema-diag.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call one numbered turn and print safe error
        env:
          PREVIEW_GM_URL: https://deploy-preview-67--survival-zero-ai-test.netlify.app
        run: |
          node <<'NODE'
          const checkpoint = {
            contract_version:1,payload_visibility:'public',source_kind:'synthetic-fixture',checkpoint_id:'schema-diag',season_id:'WEB_MVP_TEST_SESSION',phase:'NON_CANONICAL_TEST',date:'2030-01-01',time:'18:00',player_location:'사무실',
            family:[],resources:[],base_capabilities:[],active_visible_pressure:'도심 정전',recent_visible_change:'건물의 불이 꺼졌다.',
            current_scene:{id:'start',narrative:'퇴근 직전 사무실과 주변 건물이 동시에 정전됐다. 집에는 가족이 있다.',choices:[{id:1,label:'가족에게 먼저 전화한다',action:{id:'p1',label:'전화',actors:['player'],exclusive_resources:[],proposal:{time_delta_min:0,moves:[],resource_changes:[],base_capability_changes:[],world_changes:[]}}}],presentation_blocks:[]},
            committed_turn:{number:0,log:[]},public_state:{public_world:{outage_visible:true}}
          }
          const started=Date.now()
          const response=await fetch(`${process.env.PREVIEW_GM_URL}/api/gm`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({input:{kind:'numbered-choice',choice_id:1},checkpoint}),signal:AbortSignal.timeout(18000)})
          const payload=await response.json()
          console.log('SCHEMA_DIAG',JSON.stringify({http:response.status,latency_ms:Date.now()-started,status:payload.status,message:payload.message,failure:payload.diagnostic?.failure_category,fingerprint:payload.diagnostic?.response_fingerprint}))
          NODE
