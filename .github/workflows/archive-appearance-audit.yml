name: Audit character appearance sources
on:
  pull_request:
    paths:
      - 'archive/scripts/audit-character-appearance-sources.py'
      - '.github/workflows/archive-appearance-audit.yml'
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch authoritative character sources
        run: git fetch origin worldline/afterfall-rpg:refs/remotes/origin/worldline/afterfall-rpg
      - name: Read-only source candidates (not automatic canon)
        run: python archive/scripts/audit-character-appearance-sources.py --ref origin/worldline/afterfall-rpg
