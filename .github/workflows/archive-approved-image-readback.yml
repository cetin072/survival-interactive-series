name: Verify approved Archive image readback

# One trusted foreground proof on this repository branch. Never run on PRs,
# pull_request_target, forks, a schedule, or Production deployment.
on:
  push:
    branches:
      - codex/illustration-automation-v1
    paths:
      - .github/workflows/archive-approved-image-readback.yml
      - archive/scripts/deliver-approved-jinwoo.py
      - archive/scripts/verify-eunchae-site.py
      - archive/scripts/derive_site_original.py
      - archive/content/visuals/C03-AFTERFALL/SITE_ASSETS.json
      - archive/web/public/visual-assets/**

permissions:
  contents: read

jobs:
  readback:
    if: github.repository == 'cetin072/survival-interactive-series' && github.ref == 'refs/heads/codex/illustration-automation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image verifier
        run: 'python -m pip install --only-binary=:all: --no-deps Pillow==12.3.0'
      - name: Read existing private original and verify committed site derivative
        env:
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: python archive/scripts/deliver-approved-jinwoo.py --storage --check
      - name: Read new private original and verify committed site derivative
        env:
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: python archive/scripts/verify-eunchae-site.py --storage
