name: Temporary Anonymous Draft Preview

on:
  push:
    branches:
      - feature/ai-gm-deepseek-provider
    paths:
      - '.github/workflows/draft-preview-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-anonymous-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/web/package-lock.json

      - name: Install web dependencies
        working-directory: engine/web
        run: npm ci

      - name: Build fixed frontend
        working-directory: engine/web
        run: npm run build

      - name: Prepare isolated preview proxy
        shell: bash
        run: |
          mkdir -p tmp-preview-functions
          cat > tmp-preview-functions/gm.mjs <<'EOF'
          const UPSTREAM = 'https://6a98076aa5770081cf4d4a59--survival-zero-ai-test.netlify.app/api/gm'

          export default async (request) => {
            const method = request.method || 'POST'
            const body = method === 'GET' || method === 'HEAD' ? undefined : await request.text()
            const upstream = await fetch(UPSTREAM, {
              method,
              headers: { 'content-type': request.headers.get('content-type') || 'application/json' },
              body,
            })
            return new Response(await upstream.arrayBuffer(), {
              status: upstream.status,
              headers: { 'content-type': upstream.headers.get('content-type') || 'application/json' },
            })
          }
          EOF

          cat > engine/web/dist/_redirects <<'EOF'
          /api/gm  /.netlify/functions/gm  200
          /*       /index.html              200
          EOF

      - name: Deploy anonymous Draft only
        shell: bash
        run: |
          npx -y netlify-cli@latest deploy \
            --allow-anonymous \
            --context deploy-preview \
            --dir engine/web/dist \
            --functions tmp-preview-functions \
            --message "Temporary MVP turn-loop human playtest" \
            --no-build \
            --json | tee netlify-anonymous-draft.json

          node - <<'NODE'
          const fs = require('fs')
          const x = JSON.parse(fs.readFileSync('netlify-anonymous-draft.json', 'utf8'))
          const url = x.deploy_url || x.deploy_ssl_url || x.url || x.ssl_url || ''
          console.log(`DRAFT_PREVIEW_URL=${url}`)
          if (!url) process.exit(4)
          NODE
