name: Prepare one private Archive image upload

# Preview branch only. This issues a short-lived token for one hard-coded object;
# it does not upload an image, run on PRs/forks, publish a site, or write a DB row.
on:
  push:
    branches:
      - codex/illustration-automation-v1
    paths:
      - .github/workflows/archive-eunchae-signed-upload.yml
      - .github/eunchae-upload-public.pem
      - archive/scripts/eunchae_signed_handoff.py

permissions:
  contents: read

jobs:
  issue:
    if: github.repository == 'cetin072/survival-interactive-series' && github.ref == 'refs/heads/codex/illustration-automation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned envelope library
        run: 'python -m pip install --only-binary=:all: cryptography==50.0.1'
      - name: Check scoped signing and no plaintext token in output
        run: python archive/scripts/test_eunchae_signed_handoff.py
      - name: Sign only the pinned private Storage path and encrypt its token
        env:
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: python archive/scripts/eunchae_signed_handoff.py --issue
