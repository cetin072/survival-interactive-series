name: Validate knowledge BRIEF pipeline

on:
  pull_request:
    paths:
      - 'knowledge/**'
      - 'archive/scripts/*knowledge*'
      - 'archive/scripts/lib/knowledge*'
      - 'archive/web/public/knowledge/**'
      - 'archive/web/public/sitemap.xml'
      - 'archive/web/package.json'
      - 'supabase/migrations/*knowledge_semantic*'
      - 'supabase/migrations/*knowledge_operator*'
      - '.github/workflows/knowledge-semantic-prep.yml'
      - '.github/workflows/knowledge-semantic-finalizer.yml'
      - '.github/workflows/knowledge.yml'
      - '.github/workflows/knowledge-publish-prepare.yml'
      - '.github/workflows/knowledge-exact-head.yml'
      - '.github/workflows/knowledge-review-consumer.yml'
      - '.github/workflows/knowledge-worker-state.yml'
      - '.github/workflows/knowledge-worker-gate.yml'
      - 'docs/KNOWLEDGE_WORKER_*.md'
      - 'docs/KNOWLEDGE_SEMANTIC_*.md'
      - 'docs/KNOWLEDGE_AUTOMATION_C3_*.md'
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
      - 'archive/scripts/*knowledge*'
      - 'archive/scripts/lib/knowledge*'
      - 'archive/web/public/knowledge/**'
      - 'archive/web/public/sitemap.xml'
      - 'archive/web/package.json'
      - 'supabase/migrations/*knowledge_semantic*'
      - 'supabase/migrations/*knowledge_operator*'
      - '.github/workflows/knowledge-semantic-prep.yml'
      - '.github/workflows/knowledge-semantic-finalizer.yml'
      - '.github/workflows/knowledge.yml'
      - '.github/workflows/knowledge-publish-prepare.yml'
      - '.github/workflows/knowledge-exact-head.yml'
      - '.github/workflows/knowledge-review-consumer.yml'
      - '.github/workflows/knowledge-worker-state.yml'
      - 'docs/KNOWLEDGE_WORKER_*.md'
      - 'docs/KNOWLEDGE_SEMANTIC_*.md'
      - 'docs/KNOWLEDGE_AUTOMATION_C3_*.md'

jobs:
  knowledge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: archive/web/package-lock.json
      - run: npm ci
      - name: Read existing canonical Reader provenance for drift regression
        run: git fetch origin worldline/afterfall-rpg:refs/remotes/origin/worldline/afterfall-rpg
      - name: Knowledge scanner, contract, generator and gate tests
        run: npm run knowledge:test
      - name: C3 semantic-job contracts and recovery tests
        run: npm run knowledge:semantic:test
      - name: Automation C Review Queue contracts
        run: |
          node --test ../scripts/lib/knowledge-review-sync.test.mjs
          node --test ../scripts/lib/knowledge-review-consumer.test.mjs
          node --test ../scripts/lib/knowledge-human-approved.test.mjs
          node --test ../scripts/lib/knowledge-operator-draft-apply.test.mjs
      - name: Syntax-check Knowledge publication executors
        run: |
          node --check ../scripts/knowledge-publish-prepare.mjs
          node --check ../scripts/knowledge-production-verify.mjs
          node --check ../scripts/knowledge-review-sync.mjs
          node --check ../scripts/knowledge-review-consumer.mjs
          node --check ../scripts/knowledge-review-revalidate.mjs
          node --check ../scripts/knowledge-human-approved-prepare.mjs
          node --check ../scripts/knowledge-human-approved-release-check.mjs
          node --check ../scripts/knowledge-operator-draft-apply.mjs
          node --check ../scripts/write-deploy-meta.mjs
          node --check ../scripts/knowledge-worker-preflight.mjs
          node --check ../scripts/knowledge-worker-disposition.mjs
          node --check ../scripts/knowledge-worker-state-check.mjs
          node --check ../scripts/knowledge-semantic-prepare.mjs
          node --check ../scripts/knowledge-semantic-finalize.mjs
      - name: Verify checked-in static pages, sitemap and source inventory
        run: npm run knowledge:check
      - name: Archive Reader public-source regression
        run: node --test ../scripts/lib/reader-batch.test.mjs
      - name: Site build
        run: npm run build
