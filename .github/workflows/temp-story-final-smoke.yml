name: Temporary Story GM Final Smoke

on:
  push:
    branches:
      - feature/ai-gm-deepseek-provider
    paths:
      - '.github/workflows/temp-story-final-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify numbered and free narrative turns
        env:
          PREVIEW_GM_URL: https://deploy-preview-67--survival-zero-ai-test.netlify.app
        run: |
          node <<'NODE'
          const noop = label => ({id:'placeholder',label,actors:['player'],exclusive_resources:[],proposal:{time_delta_min:0,moves:[],resource_changes:[],base_capability_changes:[],world_changes:[]}})
          const checkpoint={contract_version:1,payload_visibility:'public',source_kind:'synthetic-fixture',checkpoint_id:'final-smoke',season_id:'WEB_MVP_TEST_SESSION',phase:'NON_CANONICAL_TEST',date:'2030-01-01',time:'18:00',player_location:'도심 사무실',family:[{id:'wife',name:'서윤',location:'집',condition:'아이와 함께 있음'},{id:'son',name:'민석',location:'집',condition:'평온'},{id:'father',name:'정호',location:'집',condition:'평온'}],resources:[{id:'communications',name:'통신',band:'불안정'}],base_capabilities:[],active_visible_pressure:'갑작스러운 광역 정전과 통신 불안정',recent_visible_change:'사무실과 주변 건물이 동시에 어두워졌다.',current_scene:{id:'start',narrative:'퇴근 직전 사무실 전체가 갑자기 정전됐다. 창밖 여러 건물도 동시에 어두워졌고 휴대전화 데이터 연결도 불안정하다. 집에는 가족이 있다.',choices:[{id:1,label:'가족에게 먼저 전화한다',action:noop('가족에게 먼저 전화한다')},{id:2,label:'창밖과 복도의 상황부터 확인한다',action:noop('상황 확인')}],presentation_blocks:[]},committed_turn:{number:0,log:[{id:0,kind:'scene',text:'광역 정전이 시작됐다.'}]},public_state:{public_world:{outage_visible:true}}}

          async function call(label,input){
            const started=Date.now()
            try{
              const response=await fetch(`${process.env.PREVIEW_GM_URL}/api/gm`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({input,checkpoint}),signal:AbortSignal.timeout(18000)})
              const payload=await response.json()
              const result={label,http:response.status,latency_ms:Date.now()-started,status:payload.status,message:payload.message,failure:payload.diagnostic?.failure_category,dropped_actions:payload.diagnostic?.response_fingerprint?.state_actions_dropped,narrative:payload.proposal?.narrative,next_choices:payload.proposal?.next_choices?.map(x=>x.label),family:payload.proposal?.family_reactions?.length}
              console.log('FINAL_STORY_SMOKE',JSON.stringify(result))
              return response.status===200&&payload.status==='proposal'&&typeof payload.proposal?.narrative==='string'&&(payload.proposal?.next_choices?.length??0)>=1
            }catch(error){console.log('FINAL_STORY_SMOKE',JSON.stringify({label,error:error?.name??'error',latency_ms:Date.now()-started}));return false}
          }
          const results=await Promise.all([
            call('numbered',{kind:'numbered-choice',choice_id:1}),
            call('free',{kind:'free-action',text:'휴대전화 손전등을 켜고 가족에게 전화하면서 비상계단으로 내려갈 준비를 한다'})
          ])
          if(results.some(x=>!x))process.exit(1)
          NODE
