name: Validate survival game state

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: pip install jsonschema

      - name: Validate save and runtime state schemas
        run: python tools/validate_state.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/web/package-lock.json

      - name: Install web dependencies
        working-directory: engine/web
        run: npm ci

      - name: Test web engine and GM coprocessor
        working-directory: engine/web
        run: npm test

      - name: Build web engine
        working-directory: engine/web
        run: npm run build
