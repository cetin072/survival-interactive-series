name: Validate survival game state

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: pip install jsonschema

      - name: Validate save and runtime state schemas
        run: python tools/validate_state.py

      - name: Validate presentation boot contract
        run: python tools/validate_presentation_boot.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/web/package-lock.json

      - name: Install web dependencies
        working-directory: engine/web
        run: npm ci

      - name: Test web engine and GM coprocessor
        working-directory: engine/web
        run: npm test

      - name: Build web engine
        working-directory: engine/web
        run: npm run build

      - name: Capture preview-only blind GM model A/B
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 67
        shell: bash
        run: |
          set +e
          PREVIEW_URL="https://deploy-preview-${{ github.event.pull_request.number }}--survival-zero-ai-test.netlify.app"
          ENDPOINT="$PREVIEW_URL/.netlify/functions/gm-model-ab"

          echo "Waiting for latest Deploy Preview benchmark endpoint..."
          ready=0
          for i in $(seq 1 48); do
            code=$(curl -sS --max-time 10 -o /tmp/gm-ab-probe -w '%{http_code}' "$ENDPOINT?variant=A&case=probe" 2>/dev/null)
            if [ "$code" = "400" ]; then
              ready=1
              break
            fi
            sleep 5
          done

          if [ "$ready" != "1" ]; then
            echo "GM_AB_ENDPOINT_NOT_READY"
            cat /tmp/gm-ab-probe 2>/dev/null || true
            exit 0
          fi

          for variant in A B; do
            for case_id in father-son-split wife-conditional-split; do
              echo "===== GM_AB variant=$variant case=$case_id ====="
              curl -sS --max-time 45 -w '\nHTTP_STATUS:%{http_code}\n' \
                "$ENDPOINT?variant=$variant&case=$case_id" || true
              echo
            done
          done
