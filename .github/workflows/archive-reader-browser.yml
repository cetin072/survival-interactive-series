name: Validate Archive reader navigation

on:
  pull_request:
    paths:
      - 'archive/web/**'
      - 'archive/content/**'
      - 'archive/scripts/run-daily-archive.mjs'
      - 'archive/scripts/lib/archive-source-discovery*'
      - 'archive/scripts/check-reader-browser.py'
      - 'archive/scripts/reader_deploy_identity.py'
      - 'archive/scripts/test_reader_deploy_identity.py'
      - '.github/workflows/archive-reader-browser.yml'
  push:
    branches: [main]
    paths:
      - 'archive/web/**'
      - 'archive/content/**'
      - 'archive/scripts/check-reader-browser.py'
      - 'archive/scripts/reader_deploy_identity.py'
      - 'archive/scripts/test_reader_deploy_identity.py'
      - '.github/workflows/archive-reader-browser.yml'

permissions:
  contents: read

concurrency:
  group: archive-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: archive/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: archive/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing app dependencies
        run: npm ci
      - name: Fetch source for unchanged RAW verification
        run: git fetch origin worldline/afterfall-rpg:refs/remotes/origin/worldline/afterfall-rpg
      - name: Verify publication and build
        run: npm run build:verified
        env:
          ARCHIVE_AFTERFALL_SOURCE_REF: origin/worldline/afterfall-rpg
          ARCHIVE_BUILD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install browser test tooling (not a runtime dependency)
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Audit built app on touch mobile and desktop
        run: python ../scripts/check-reader-browser.py --world-wiki --screenshots "$RUNNER_TEMP/archive-browser/local"
      - name: Fetch recent PR history for source-equivalent preview verification
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags --depth=50 origin "refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-$PR_NUMBER"
      - name: Test deployment identity matcher
        working-directory: .
        run: python -m unittest discover -s archive/scripts -p "test_reader_deploy_identity.py"
      - name: Verify tested assets and navigation on Deploy Preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: python ../scripts/check-reader-browser.py --url https://deploy-preview-${{ github.event.pull_request.number }}--survival-diary-archive.netlify.app --wait-assets --world-wiki --screenshots "$RUNNER_TEMP/archive-browser/preview"
      - name: Detect a batched Production release commit
        id: production_release
        if: github.event_name == 'push'
        working-directory: .
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- archive/web/public/release/production.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify tested assets and navigation on Production
        if: github.event_name == 'push' && steps.production_release.outputs.changed == 'true'
        run: python ../scripts/check-reader-browser.py --url https://survival-diary-archive.netlify.app --wait-assets
      - name: Upload browser review captures and audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-browser-review
          path: ${{ runner.temp }}/archive-browser
          if-no-files-found: warn
