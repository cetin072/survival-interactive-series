name: BAG-SIDE-01 experimental UI state check
on:
  pull_request:
    paths:
      - 'archive/web/public/bag-lab/**'
      - 'archive/scripts/lib/bag-side-*.test.mjs'
      - 'archive/scripts/check-bag-side-*.py'
      - '.github/workflows/bag-side-lab-check.yml'
permissions:
  contents: read
jobs:
  model-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check all bag UI module syntax
        run: |
          for file in archive/web/public/bag-lab/*.mjs; do node --check "$file"; done
      - name: Run original demo and personal Alpha state tests
        run: node --test archive/scripts/lib/bag-side-lab.test.mjs archive/scripts/lib/bag-side-alpha.test.mjs archive/scripts/lib/bag-side-catalog.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tools for click-through QA
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Original demo mobile and desktop regression
        run: python archive/scripts/check-bag-side-demo.py
      - name: Personal Alpha real browser persistence and recovery
        run: |
          set -o pipefail
          mkdir -p archive/reports/bag-side-alpha
          python -u archive/scripts/check-bag-side-alpha.py 2>&1 | tee archive/reports/bag-side-alpha/local.log
      - name: Original demo deployed Preview with exact SHA
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BAG_LAB_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--survival-diary-archive.netlify.app
          BAG_LAB_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: python archive/scripts/check-bag-side-demo.py
      - name: Personal Alpha deployed Preview with exact SHA
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BAG_LAB_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--survival-diary-archive.netlify.app
          BAG_LAB_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          python -u archive/scripts/check-bag-side-alpha.py 2>&1 | tee archive/reports/bag-side-alpha/preview.log
      - name: Preserve demo and explicit Alpha boundaries
        run: |
          grep -q 'name="robots" content="noindex' archive/web/public/bag-lab/index.html
          grep -q '가상 데이터 · 저장/알림 없음' archive/web/public/bag-lab/index.html
          grep -q 'name="robots" content="noindex' archive/web/public/bag-lab/alpha.html
          grep -q '알림·클라우드 동기화 없음' archive/web/public/bag-lab/alpha.html
      - name: Keep synthetic-only browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bag-side-alpha-browser-${{ github.event.pull_request.head.sha }}
          path: archive/reports/bag-side-alpha/
          retention-days: 7
          if-no-files-found: warn
