name: Private Archive illustration Draft Release handoff

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: ID of the unpublished Draft Release containing exactly one accepted PNG
        required: true
        type: string
      source_commit:
        description: Full commit SHA containing the exact accepted identity JSON
        required: true
        type: string
      identity_path:
        description: Repository path to the accepted illustration identity JSON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: afterfall-private-image-handoff
  cancel-in-progress: false

jobs:
  handoff:
    if: github.repository == 'cetin072/survival-interactive-series' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cleanup_ready: ${{ steps.prepare.outputs.cleanup_ready }}
      release_id: ${{ steps.prepare.outputs.release_id }}
      tag_name: ${{ steps.prepare.outputs.tag_name }}
    steps:
      - name: Check out the trusted main workflow commit and exact source history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PNG validator
        run: python -m pip install --only-binary=:all: Pillow==12.3.0
      - name: Validate source commit, identity, and Draft Release before enabling cleanup
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IDENTITY_PATH: ${{ inputs.identity_path }}
        run: >-
          python archive/scripts/draft_release_illustration_handoff.py
          --prepare --release-id "$RELEASE_ID"
          --source-commit "$SOURCE_COMMIT" --identity "$IDENTITY_PATH"
      - name: Verify Draft Release asset, upload privately, and reconcile exact registry row
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IDENTITY_PATH: ${{ inputs.identity_path }}
          ARCHIVE_ORIGINAL_STORAGE_PROVIDER: supabase
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
          ARCHIVE_ORIGINAL_STORAGE_BUCKET: survival-archive-originals
        run: >-
          python archive/scripts/draft_release_illustration_handoff.py
          --process --release-id "$RELEASE_ID"
          --source-commit "$SOURCE_COMMIT" --identity "$IDENTITY_PATH"

  cleanup:
    if: always() && needs.handoff.outputs.cleanup_ready == 'true'
    needs: handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out trusted main workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PNG validator
        run: python -m pip install --only-binary=:all: Pillow==12.3.0
      - name: Delete the verified temporary Draft Release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.handoff.outputs.release_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IDENTITY_PATH: ${{ inputs.identity_path }}
          TAG_NAME: ${{ needs.handoff.outputs.tag_name }}
        run: >-
          python archive/scripts/draft_release_illustration_handoff.py
          --cleanup --release-id "$RELEASE_ID"
          --source-commit "$SOURCE_COMMIT" --identity "$IDENTITY_PATH"
          --tag-name "$TAG_NAME"
