name: Private Archive illustration Draft Release handoff

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: ID of the unpublished Draft Release containing exactly one accepted PNG
        required: true
        type: string
      source_commit:
        description: Full commit SHA containing the exact accepted identity JSON
        required: true
        type: string
      identity_path:
        description: Repository path to the accepted illustration identity JSON
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'archive/automation/illustration-handoff-requests/*.json'

permissions:
  contents: read

concurrency:
  group: afterfall-private-image-handoff
  cancel-in-progress: false

jobs:
  handoff:
    if: github.repository == 'cetin072/survival-interactive-series' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cleanup_ready: ${{ steps.prepare.outputs.cleanup_ready }}
      release_id: ${{ steps.prepare.outputs.release_id }}
      tag_name: ${{ steps.prepare.outputs.tag_name }}
      source_commit: ${{ steps.request.outputs.source_commit }}
      identity_path: ${{ steps.request.outputs.identity_path }}
    steps:
      - name: Check out the trusted main workflow commit and exact source history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve one immutable handoff request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_RELEASE_ID: ${{ inputs.release_id }}
          DISPATCH_SOURCE_COMMIT: ${{ inputs.source_commit }}
          DISPATCH_IDENTITY_PATH: ${{ inputs.identity_path }}
        run: |
          output="$RUNNER_TEMP/illustration-handoff-request.json"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python archive/scripts/resolve_illustration_handoff_request.py \
              --dispatch \
              --release-id "$DISPATCH_RELEASE_ID" \
              --source-commit "$DISPATCH_SOURCE_COMMIT" \
              --identity "$DISPATCH_IDENTITY_PATH" > "$output"
          else
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo "HANDOFF_REQUEST_BEFORE_SHA_INVALID" >&2
              exit 1
            fi
            mapfile -t changed < <(
              git diff --name-status "$BEFORE_SHA" "$CURRENT_SHA" -- \
                'archive/automation/illustration-handoff-requests/*.json'
            )
            if [[ "${#changed[@]}" -ne 1 ]]; then
              echo "HANDOFF_REQUEST_CHANGE_COUNT_INVALID: ${#changed[@]}" >&2
              exit 1
            fi
            status="${changed[0]%%$'\t'*}"
            request_path="${changed[0]#*$'\t'}"
            if [[ "$status" != "A" ]]; then
              echo "HANDOFF_REQUEST_MUST_BE_IMMUTABLE_ADD: $status" >&2
              exit 1
            fi
            python archive/scripts/resolve_illustration_handoff_request.py \
              --request "$request_path" > "$output"
          fi
          cat "$output"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "illustration-handoff-request.json").read_text())
          for key in ("release_id", "source_commit", "identity_path"):
              print(f"{key}={value[key]}")
          PY
      - name: Install pinned PNG validator
        run: python -m pip install --only-binary=:all: Pillow==12.3.0
      - name: Validate source commit, identity, and Draft Release before enabling cleanup
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.request.outputs.release_id }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          IDENTITY_PATH: ${{ steps.request.outputs.identity_path }}
        run: >-
          python archive/scripts/draft_release_illustration_handoff.py
          --prepare --release-id "$RELEASE_ID"
          --source-commit "$SOURCE_COMMIT" --identity "$IDENTITY_PATH"
      - name: Verify Draft Release asset, upload privately, and reconcile exact registry row
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.request.outputs.release_id }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          IDENTITY_PATH: ${{ steps.request.outputs.identity_path }}
          ARCHIVE_ORIGINAL_STORAGE_PROVIDER: supabase
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
          ARCHIVE_ORIGINAL_STORAGE_BUCKET: survival-archive-originals
        run: >-
          python archive/scripts/draft_release_illustration_handoff.py
          --process --release-id "$RELEASE_ID"
          --source-commit "$SOURCE_COMMIT" --identity "$IDENTITY_PATH"

  cleanup:
    if: always() && needs.handoff.outputs.cleanup_ready == 'true'
    needs: handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out trusted main workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PNG validator
        run: python -m pip install --only-binary=:all: Pillow==12.3.0
      - name: Delete the verified temporary Draft Release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.handoff.outputs.release_id }}
          SOURCE_COMMIT: ${{ needs.handoff.outputs.source_commit }}
          IDENTITY_PATH: ${{ needs.handoff.outputs.identity_path }}
          TAG_NAME: ${{ needs.handoff.outputs.tag_name }}
        run: >-
          python archive/scripts/draft_release_illustration_handoff.py
          --cleanup --release-id "$RELEASE_ID"
          --source-commit "$SOURCE_COMMIT" --identity "$IDENTITY_PATH"
          --tag-name "$TAG_NAME"
