name: Validate survival diary archive

on:
  pull_request:
    paths:
      - 'archive/web/**'
      - 'archive/content/**'
      - 'archive/scripts/**'
      - 'archive/automation/**'
      - '.github/workflows/archive-web.yml'
      - '.github/workflows/archive-daily.yml'
      - '.github/workflows/archive-production-release.yml'
      - '.github/workflows/archive-site-derivative.yml'
  push:
    branches:
      - main
    paths:
      - 'archive/web/**'
      - 'archive/content/**'
      - 'archive/scripts/**'
      - 'archive/automation/**'
      - '.github/workflows/archive-web.yml'
      - '.github/workflows/archive-daily.yml'
      - '.github/workflows/archive-production-release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: archive/web/package-lock.json
      - name: Test offline publication planning
        run: node --test ../scripts/lib/publication-plan.test.mjs
      - name: Test illustration worker controls
        run: |
          node --test ../scripts/lib/illustration-image-prompt.test.mjs
          node --test ../scripts/lib/illustration-generation-provider.test.mjs
          node --test ../scripts/lib/illustration-run-receipt.test.mjs
          node --test ../scripts/lib/illustration-worker.test.mjs
      - name: Test original image storage provider boundary
        run: |
          python3 ../scripts/test_original_storage_provider.py
          python3 ../scripts/test_illustration_storage_handoff.py
          python3 -m pip install --only-binary=:all: Pillow==12.3.0
          python3 ../scripts/test_draft_release_illustration_handoff.py
          python3 ../scripts/test_staged_illustration_handoff.py
          python3 ../scripts/test_resolve_illustration_handoff_request.py
          python3 ../scripts/test_prepare_site_derivative.py
          node --check ../scripts/run-production-release.mjs
          python3 -m py_compile ../scripts/original_storage_provider.py ../scripts/illustration_storage_handoff.py ../scripts/draft_release_illustration_handoff.py ../scripts/staged_illustration_handoff.py ../scripts/resolve_illustration_handoff_request.py ../scripts/execute_trusted_illustration_handoff.py ../scripts/prepare_site_derivative.py
      - name: Verify deterministic S02 dry-run (no external services)
        run: |
          node ../scripts/dry-run-publication.mjs --demo-s02 --source-revision "$GITHUB_SHA" > "$RUNNER_TEMP/publication-first.json"
          node ../scripts/dry-run-publication.mjs --demo-s02 --source-revision "$GITHUB_SHA" > "$RUNNER_TEMP/publication-second.json"
          cmp "$RUNNER_TEMP/publication-first.json" "$RUNNER_TEMP/publication-second.json"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/publication-first.json","utf8")); assert.equal(p.mode,"DRY_RUN_ONLY"); assert.equal(p.snapshot.source_save_version,253); assert.equal(p.summary.reader_input_spans,5); assert.equal(p.summary.paired_turns,34); assert.equal(p.summary.rolling_captured_messages,70); assert.equal(p.summary.preserved_fragments,2); assert.equal(p.summary.external_calls,0); assert.equal(p.summary.records_written,0); console.log(JSON.stringify(p.summary));'
      - name: Test Reader batch security and atomic replacement
        run: node --test ../scripts/lib/reader-batch.test.mjs
      - name: Test daily source admission, immutable segment, and replay
        run: node --test ../scripts/lib/archive-daily-core.test.mjs
      - name: Test exact Netlify production deploy identity
        run: node --test ../scripts/lib/netlify-production.test.mjs
      - name: Test batched Production release policy
        run: node --test ../scripts/lib/production-release.test.mjs
      - name: Verify real Reader roundtrip and isolated new-RAW publication
        run: node ../scripts/check-reader-batch.mjs
      - name: Test public graph reconciliation and atomic persistence
        run: node --test ../scripts/lib/publication-graph.test.mjs
      - name: Verify public graph baseline and isolated fact-to-graph integration
        run: node --experimental-strip-types ../scripts/check-graph-batch.mjs
      - name: Test visual candidate and brief compiler
        run: node --test ../scripts/lib/visual-compiler.test.mjs
      - name: Verify public appearance-to-brief and isolated visual catalog integration
        run: node --experimental-strip-types ../scripts/check-visual-batch.mjs
      - name: Test local image POC request and quarantine receipts
        run: node --test ../scripts/lib/image-poc-exchange.test.mjs
      - name: Verify real portrait request without image execution
        run: node --experimental-strip-types ../scripts/prepare-image-poc.mjs --check
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Fetch AFTERFALL source for RAW integrity comparison
        run: git fetch origin worldline/afterfall-rpg:refs/remotes/origin/worldline/afterfall-rpg
      - name: Verify Reader publication
        run: npm run reader:check
        env:
          ARCHIVE_AFTERFALL_SOURCE_REF: origin/worldline/afterfall-rpg
      - name: Build
        run: npm run build
