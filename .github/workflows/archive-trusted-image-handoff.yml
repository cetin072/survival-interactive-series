name: Trusted Archive illustration handoff

on:
  push:
    branches:
      - main
    paths:
      - 'archive/automation/illustration-handoff-requests/*.json'

permissions:
  contents: read

concurrency:
  group: archive-trusted-illustration-handoff
  cancel-in-progress: false

jobs:
  handoff:
    if: github.repository == 'cetin072/survival-interactive-series'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PNG validator
        run: python -m pip install --only-binary=:all: Pillow==12.3.0
      - name: Execute exactly one newly-added trusted request
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
          ARCHIVE_ORIGINAL_STORAGE_PROVIDER: supabase
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
          ARCHIVE_ORIGINAL_STORAGE_BUCKET: survival-archive-originals
        shell: bash
        run: |
          mapfile -t changed < <(
            git diff --name-status "$BEFORE_SHA" "$CURRENT_SHA" -- \
              'archive/automation/illustration-handoff-requests/*.json'
          )
          if [[ "${#changed[@]}" -ne 1 ]]; then
            echo "HANDOFF_REQUEST_CHANGE_COUNT_INVALID: ${#changed[@]}" >&2
            exit 1
          fi
          status="${changed[0]%%$'\t'*}"
          request_path="${changed[0]#*$'\t'}"
          if [[ "$status" != "A" ]]; then
            echo "HANDOFF_REQUEST_MUST_BE_IMMUTABLE_ADD: $status" >&2
            exit 1
          fi
          python archive/scripts/execute_trusted_illustration_handoff.py \
            --request "$request_path"
