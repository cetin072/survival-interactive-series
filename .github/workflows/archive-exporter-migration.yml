name: Verify Archive, Illustration and Knowledge DB contracts

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/archive_exporter_readonly_verification.sql'
      - 'supabase/tests/illustration_shared_review_context_v1_verification.sql'
      - 'supabase/tests/illustration_registry_dedup_v1_verification.sql'
      - '.github/workflows/archive-exporter-migration.yml'
      - 'supabase/tests/knowledge_semantic_jobs_verification.sql'
      - 'supabase/tests/knowledge_ex001_source_verification.sql'
      - 'supabase/tests/knowledge_ex001_review_revalidation.sql'
      - 'supabase/tests/knowledge_ex001_existing_review_rebind.sql'
      - 'supabase/tests/knowledge_ex001_published_reconcile.sql'
      - 'supabase/tests/knowledge_operational_recovery.sql'
      - 'supabase/tests/knowledge_review_supersession.sql'
      - 'supabase/tests/knowledge_main_drift.sql'
      - 'supabase/migrations/20261005020000_knowledge_ex001_published_reconcile.sql'
      - 'supabase/tests/knowledge_semantic_jobs_crash_recovery.psql'
      - 'supabase/tests/knowledge_semantic_review_e2e.sql'
      - 'supabase/tests/knowledge_semantic_published_reconcile.sql'
      - 'supabase/tests/knowledge_semantic_finalizer_retry.sql'
      - 'supabase/tests/knowledge_operator_inbox_verification.sql'
      - 'supabase/tests/knowledge_operator_drafts_verification.sql'
      - 'supabase/tests/knowledge_media_bucket_verification.sql'
      - 'supabase/migrations/20261001233000_knowledge_semantic_published_reconcile_v1.sql'
      - 'supabase/migrations/20261003090000_knowledge_operator_inbox_v1.sql'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/archive_exporter_readonly_verification.sql'
      - 'supabase/tests/illustration_shared_review_context_v1_verification.sql'
      - 'supabase/tests/illustration_registry_dedup_v1_verification.sql'
      - '.github/workflows/archive-exporter-migration.yml'
      - 'supabase/tests/knowledge_semantic_jobs_verification.sql'
      - 'supabase/tests/knowledge_ex001_source_verification.sql'
      - 'supabase/tests/knowledge_ex001_review_revalidation.sql'
      - 'supabase/tests/knowledge_ex001_existing_review_rebind.sql'
      - 'supabase/tests/knowledge_ex001_published_reconcile.sql'
      - 'supabase/tests/knowledge_operational_recovery.sql'
      - 'supabase/tests/knowledge_review_supersession.sql'
      - 'supabase/tests/knowledge_main_drift.sql'
      - 'supabase/migrations/20261005020000_knowledge_ex001_published_reconcile.sql'
      - 'supabase/tests/knowledge_semantic_jobs_crash_recovery.psql'
      - 'supabase/tests/knowledge_semantic_review_e2e.sql'
      - 'supabase/tests/knowledge_semantic_published_reconcile.sql'
      - 'supabase/tests/knowledge_semantic_finalizer_retry.sql'
      - 'supabase/tests/knowledge_operator_inbox_verification.sql'
      - 'supabase/tests/knowledge_operator_drafts_verification.sql'
      - 'supabase/tests/knowledge_media_bucket_verification.sql'
      - 'supabase/migrations/20261001233000_knowledge_semantic_published_reconcile_v1.sql'

permissions:
  contents: read

jobs:
  archive-db-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create Supabase role and schema prerequisites
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS; CREATE ROLE archive_exporter LOGIN NOINHERIT; ALTER ROLE archive_exporter SET default_transaction_read_only = 'on'; ALTER ROLE archive_exporter SET statement_timeout = '10s'; GRANT CONNECT ON DATABASE postgres TO archive_exporter; CREATE SCHEMA extensions; CREATE SCHEMA survival_rpg; CREATE EXTENSION pgcrypto WITH SCHEMA extensions;"
      - name: Apply tracked transcript capture migrations
        run: |
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260924173125_rolling_raw_capture_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260925003736_public_transcript_capture_session_api_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260925044647_public_transcript_turn_pair_api_v1.sql
      - name: Create the test-only state-link table present in the connected project
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE survival_rpg.transcript_turn_state_links (
            worldline_id text NOT NULL,
            chronicle_id text NOT NULL,
            season_id text NOT NULL,
            session_id uuid NOT NULL,
            turn_no integer NOT NULL,
            user_message_id uuid NOT NULL REFERENCES survival_rpg.transcript_messages(id),
            gm_message_id uuid NOT NULL REFERENCES survival_rpg.transcript_messages(id),
            outcome text NOT NULL,
            user_save_version integer NOT NULL,
            gm_save_version integer NOT NULL,
            linked_save_version integer NOT NULL,
            recorded_at timestamptz NOT NULL DEFAULT now()
          )'
      - name: Apply exporter privileges and policies
        run: psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260928050000_archive_exporter_readonly.sql
      - name: Verify exporter grants, RLS scope, optional links, and denied writes
        run: psql -v ON_ERROR_STOP=1 --file supabase/tests/archive_exporter_readonly_verification.sql
  knowledge-db-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create Supabase API roles for Knowledge migrations
        run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;"
      - name: Prepare isolated database for Knowledge semantic jobs
        run: |
          createdb --owner=postgres knowledge_semantic_test
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE SCHEMA auth;
          CREATE SCHEMA survival_ops;
          CREATE SCHEMA survival_rpg;
          CREATE SCHEMA storage;
          CREATE TABLE storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          CREATE TABLE storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text not null,
            name text not null
          );
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          GRANT USAGE ON SCHEMA storage TO authenticated;
          GRANT SELECT,INSERT,UPDATE,DELETE ON storage.objects TO authenticated;
          CREATE SCHEMA vault;
          CREATE SCHEMA net;
          CREATE SCHEMA cron;
          CREATE TABLE public.roles (id uuid primary key, code text unique not null, active boolean not null);
          CREATE TABLE public.platform_capabilities (code text primary key, capability_kind text not null, operations_manager_auto_grant boolean not null, description text not null, active boolean not null);
          CREATE TABLE public.role_capability_grants (role_id uuid not null references public.roles(id), capability_code text not null references public.platform_capabilities(code), primary key(role_id, capability_code));
          INSERT INTO public.roles(id,code,active) VALUES ('00000000-0000-4000-8000-000000000003','super_admin',true);
          INSERT INTO public.roles(id,code,active) VALUES ('00000000-0000-4000-8000-000000000005','viewer',true);
          CREATE TABLE public.profiles (id uuid primary key, display_name text not null, role_id uuid not null references public.roles(id), active boolean not null);
          INSERT INTO public.profiles(id,display_name,role_id,active) VALUES
            ('00000000-0000-4000-8000-000000000002','C3 CI Operator','00000000-0000-4000-8000-000000000003',true),
            ('00000000-0000-4000-8000-000000000004','C3 CI Viewer','00000000-0000-4000-8000-000000000005',true);
          CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $fn$ SELECT coalesce(nullif(current_setting('request.jwt.claims',true),'')::jsonb,'{"role":"authenticated"}'::jsonb) $fn$;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $fn$ SELECT coalesce(nullif(auth.jwt()->>'sub','')::uuid,'00000000-0000-4000-8000-000000000002'::uuid) $fn$;
          CREATE FUNCTION public.current_profile_is_active() RETURNS boolean LANGUAGE sql STABLE AS $fn$ SELECT EXISTS (SELECT 1 FROM public.profiles WHERE id=auth.uid() AND active) $fn$;
          CREATE FUNCTION public.private_actor_can(text) RETURNS boolean LANGUAGE sql STABLE AS $fn$ SELECT EXISTS (
            SELECT 1 FROM public.profiles p
            JOIN public.role_capability_grants g ON g.role_id=p.role_id
            JOIN public.platform_capabilities c ON c.code=g.capability_code AND c.active
            WHERE p.id=auth.uid() AND c.code=$1
          ) $fn$;
          CREATE TABLE vault.decrypted_secrets (name text, decrypted_secret text, created_at timestamptz);
          CREATE TABLE cron.job (jobname text primary key, schedule text not null, active boolean not null);
          CREATE FUNCTION cron.schedule(text,text,text) RETURNS bigint LANGUAGE plpgsql AS $fn$ BEGIN INSERT INTO cron.job(jobname,schedule,active) VALUES ($1,$2,true) ON CONFLICT (jobname) DO UPDATE SET schedule=excluded.schedule,active=true; RETURN 1; END $fn$;
          CREATE FUNCTION net.http_post(url text, body jsonb, headers jsonb, timeout_milliseconds integer) RETURNS bigint LANGUAGE sql AS $fn$ SELECT 1::bigint $fn$;
          CREATE TABLE survival_rpg.archive_publication_daily_runs (scheduled_date date,status text,attempt_count integer,last_error_code text,started_at timestamptz,finished_at timestamptz,created_at timestamptz);
          CREATE TABLE survival_rpg.archive_publication_tasks (task_id uuid,task_kind text,chronicle_id text,season_id text,status text,attempt_count integer,last_error_code text,updated_at timestamptz,completed_at timestamptz,created_at timestamptz);
          CREATE TABLE survival_ops.illustration_worker_runs (run_id uuid,started_at timestamptz,finished_at timestamptz,final_status text,blocker_code text,blocker_stage text,target_subject_id text,accepted_count integer,registry_status text,cleanup_status text,main_sha text,created_at timestamptz);
          SQL
      - name: Apply existing Operator review queue migrations
        run: |
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20260929173506_archive_review_control_plane_v1.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20260929232408_archive_review_hardening_v1.sql
      - name: Apply and exercise Knowledge semantic-job lifecycle
        run: |
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261001064358_knowledge_semantic_jobs_v1.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261003134500_knowledge_semantic_submit_contract_v2.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261003090000_knowledge_operator_inbox_v1.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261003093000_knowledge_operator_inbox_review_link_v1.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261004001000_knowledge_operator_drafts_v1.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261004002000_knowledge_media_bucket_v1.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_semantic_jobs_verification.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_operator_inbox_verification.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_operator_drafts_verification.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_media_bucket_verification.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_semantic_jobs_crash_recovery.psql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_semantic_review_e2e.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261001233000_knowledge_semantic_published_reconcile_v1.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261003220726_knowledge_semantic_finalizer_retry_v1.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_semantic_published_reconcile.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_semantic_finalizer_retry.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261004144834_knowledge_ex001_explicit_source.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_ex001_source_verification.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261005000000_knowledge_semantic_frequency_experience.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_semantic_frequency_experience.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261005010000_knowledge_ex001_review_revalidation.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_ex001_review_revalidation.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261005013000_knowledge_ex001_existing_review_rebind.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_ex001_existing_review_rebind.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261005020000_knowledge_ex001_published_reconcile.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_ex001_published_reconcile.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261005022404_knowledge_operational_recovery_v1.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_operational_recovery.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261005022935_knowledge_review_supersession_v1.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_review_supersession.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261005075315_knowledge_main_drift_v1.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261005083800_knowledge_main_drift_admission_v2.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_main_drift.sql

  illustration-db-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create Automation B database prerequisites
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA survival_ops;
          CREATE SCHEMA archive_ops;
          CREATE SCHEMA survival_rpg;
          CREATE TABLE survival_rpg.visual_assets(
            status text,
            source jsonb,
            object_path text,
            generation_meta jsonb
          );
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE SCHEMA vault;
          CREATE TABLE vault.decrypted_secrets(name text, decrypted_secret text, created_at timestamptz);
          CREATE SCHEMA net;
          CREATE FUNCTION net.http_post(url text, body jsonb DEFAULT '{}'::jsonb,
            params jsonb DEFAULT '{}'::jsonb, headers jsonb DEFAULT '{}'::jsonb,
            timeout_milliseconds integer DEFAULT 5000)
          RETURNS bigint LANGUAGE sql VOLATILE AS $$ SELECT -998::bigint $$;
          CREATE SCHEMA cron;
          CREATE TABLE cron.job(jobid bigint, jobname text);
          CREATE FUNCTION cron.schedule(text, text, text) RETURNS bigint
            LANGUAGE sql VOLATILE AS $$ SELECT 1::bigint $$;
          CREATE FUNCTION cron.unschedule(bigint) RETURNS boolean
            LANGUAGE sql VOLATILE AS $$ SELECT true $$;
          SQL
      - name: Apply Automation B migrations through shared review context
        run: |
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260929223500_illustration_private_binary_staging_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260930012000_illustration_render_queue_dispatch_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260930090000_illustration_review_staging_v2.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260930090001_illustration_retry_leases_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260930090002_illustration_retry_lease_hardening_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260930090003_illustration_retry_cron_dispatch_context_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20261001180000_illustration_shared_review_context_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20261002083000_illustration_registry_dedup_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20261002134000_illustration_daily_success_retry_pulse_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20261003224700_illustration_renderer_state_handoff_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20261003231500_illustration_daily_retry_index_fix_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20261007002000_illustration_finalizer_check_timeout_recovery_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20261007004500_illustration_finalizer_recovery_role_v2.sql
      - name: Verify shared review context and legacy compatibility
        run: psql -v ON_ERROR_STOP=1 --file supabase/tests/illustration_shared_review_context_v1_verification.sql
      - name: Verify Registry duplicate gate
        run: psql -v ON_ERROR_STOP=1 --file supabase/tests/illustration_registry_dedup_v1_verification.sql
      - name: Verify renderer to reviewer state handoff
        run: psql -v ON_ERROR_STOP=1 --file supabase/tests/illustration_renderer_state_handoff_v1_verification.sql
      - name: Verify same-day retry index policy
        run: psql -v ON_ERROR_STOP=1 --file supabase/tests/illustration_daily_retry_index_fix_v1_verification.sql
      - name: Verify finalizer recovery role boundary
        run: psql -v ON_ERROR_STOP=1 --file supabase/tests/illustration_finalizer_recovery_role_v2_verification.sql
      - name: Verify preserved PASS recovery in isolated database
        run: |
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20261007062615_illustration_preserved_pass_recovery.sql
          psql -v ON_ERROR_STOP=1 --file supabase/tests/illustration_preserved_pass_recovery.sql
