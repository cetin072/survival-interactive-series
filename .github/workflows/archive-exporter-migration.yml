name: Verify Archive exporter database contract

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/archive_exporter_readonly_verification.sql'
      - '.github/workflows/archive-exporter-migration.yml'
      - 'supabase/tests/knowledge_semantic_jobs_verification.sql'
      - 'supabase/tests/knowledge_semantic_jobs_crash_recovery.psql'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/archive_exporter_readonly_verification.sql'
      - '.github/workflows/archive-exporter-migration.yml'
      - 'supabase/tests/knowledge_semantic_jobs_verification.sql'
      - 'supabase/tests/knowledge_semantic_jobs_crash_recovery.psql'

permissions:
  contents: read

jobs:
  exporter-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create Supabase role and schema prerequisites
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS; CREATE ROLE archive_exporter LOGIN NOINHERIT; ALTER ROLE archive_exporter SET default_transaction_read_only = 'on'; ALTER ROLE archive_exporter SET statement_timeout = '10s'; GRANT CONNECT ON DATABASE postgres TO archive_exporter; CREATE SCHEMA extensions; CREATE SCHEMA survival_rpg; CREATE EXTENSION pgcrypto WITH SCHEMA extensions;"
      - name: Apply tracked transcript capture migrations
        run: |
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260924173125_rolling_raw_capture_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260925003736_public_transcript_capture_session_api_v1.sql
          psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260925044647_public_transcript_turn_pair_api_v1.sql
      - name: Create the test-only state-link table present in the connected project
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE survival_rpg.transcript_turn_state_links (
            worldline_id text NOT NULL,
            chronicle_id text NOT NULL,
            season_id text NOT NULL,
            session_id uuid NOT NULL,
            turn_no integer NOT NULL,
            user_message_id uuid NOT NULL REFERENCES survival_rpg.transcript_messages(id),
            gm_message_id uuid NOT NULL REFERENCES survival_rpg.transcript_messages(id),
            outcome text NOT NULL,
            user_save_version integer NOT NULL,
            gm_save_version integer NOT NULL,
            linked_save_version integer NOT NULL,
            recorded_at timestamptz NOT NULL DEFAULT now()
          )'
      - name: Apply exporter privileges and policies
        run: psql -v ON_ERROR_STOP=1 --file supabase/migrations/20260928050000_archive_exporter_readonly.sql
      - name: Verify exporter grants, RLS scope, optional links, and denied writes
        run: psql -v ON_ERROR_STOP=1 --file supabase/tests/archive_exporter_readonly_verification.sql
      - name: Prepare isolated database for Knowledge semantic jobs
        run: |
          createdb --owner=postgres knowledge_semantic_test
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE SCHEMA survival_ops;
          CREATE SCHEMA survival_rpg;
          CREATE SCHEMA vault;
          CREATE SCHEMA net;
          CREATE SCHEMA cron;
          CREATE TABLE vault.decrypted_secrets (name text, decrypted_secret text, created_at timestamptz);
          CREATE TABLE cron.job (jobname text primary key, schedule text not null, active boolean not null);
          CREATE FUNCTION cron.schedule(text,text,text) RETURNS bigint LANGUAGE plpgsql AS $fn$ BEGIN INSERT INTO cron.job(jobname,schedule,active) VALUES ($1,$2,true); RETURN 1; END $fn$;
          CREATE FUNCTION net.http_post(url text, body jsonb, headers jsonb, timeout_milliseconds integer) RETURNS bigint LANGUAGE sql AS $fn$ SELECT 1::bigint $fn$;
          CREATE FUNCTION survival_ops.private_require_archive_operator() RETURNS uuid LANGUAGE sql AS $fn$ SELECT '00000000-0000-4000-8000-000000000001'::uuid $fn$;
          CREATE TABLE survival_rpg.archive_publication_daily_runs (scheduled_date date,status text,attempt_count integer,last_error_code text,started_at timestamptz,finished_at timestamptz,created_at timestamptz);
          CREATE TABLE survival_rpg.archive_publication_tasks (task_id uuid,task_kind text,chronicle_id text,season_id text,status text,attempt_count integer,last_error_code text,updated_at timestamptz,completed_at timestamptz,created_at timestamptz);
          CREATE TABLE survival_ops.illustration_worker_runs (run_id uuid,started_at timestamptz,finished_at timestamptz,final_status text,blocker_code text,blocker_stage text,target_subject_id text,accepted_count integer,registry_status text,cleanup_status text,main_sha text,created_at timestamptz);
          CREATE TABLE survival_ops.archive_review_items (status text,item_type text);
          SQL
      - name: Apply and exercise Knowledge semantic-job lifecycle
        run: |
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/migrations/20261001064358_knowledge_semantic_jobs_v1.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_semantic_jobs_verification.sql
          psql --dbname knowledge_semantic_test -v ON_ERROR_STOP=1 --file supabase/tests/knowledge_semantic_jobs_crash_recovery.psql
