name: Finalize Knowledge semantic job

on:
  # PR state and completed validations are changes; elapsed time is not.
  pull_request:
    types: [synchronize, closed]
    paths: ['knowledge/**']
  workflow_run:
    workflows: ['Prepare Knowledge publication', 'Validate Knowledge exact publication head', 'Validate knowledge BRIEF pipeline']
    types: [completed]
  push:
    branches: [main]
    paths: ['archive/scripts/*knowledge*', 'archive/scripts/lib/knowledge*', 'archive/web/render-knowledge.mjs', 'archive/web/src/archive/knowledge*', '.github/workflows/knowledge*']
  workflow_dispatch:
    inputs:
      dispatch_origin:
        description: Scheduler origin
        required: false
        default: manual

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: knowledge-semantic-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'knowledge/worker/')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_branch, 'knowledge/worker/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require server-only credentials
        env:
          ARCHIVE_GITHUB_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_GITHUB_TOKEN" || { echo "ARCHIVE_GITHUB_TOKEN_REQUIRED"; exit 1; }
          test -n "$ARCHIVE_SUPABASE_URL" || { echo "ARCHIVE_SUPABASE_URL_REQUIRED"; exit 1; }
          test -n "$ARCHIVE_SUPABASE_SERVICE_ROLE_KEY" || { echo "ARCHIVE_SUPABASE_SERVICE_ROLE_KEY_REQUIRED"; exit 1; }

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: archive/web/package-lock.json

      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
        run: gh auth setup-git

      - name: Validate submitted package and finalize one lifecycle action
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: node archive/scripts/knowledge-semantic-finalize.mjs
