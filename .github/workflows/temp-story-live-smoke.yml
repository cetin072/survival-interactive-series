name: Temporary Story GM Live Smoke

on:
  push:
    branches:
      - feature/ai-gm-deepseek-provider
    paths:
      - '.github/workflows/temp-story-live-smoke.yml'

jobs:
  story-turns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify one numbered and one free story turn
        env:
          PREVIEW_GM_URL: https://deploy-preview-67--survival-zero-ai-test.netlify.app
        run: |
          node <<'NODE'
          const checkpoint = {
            contract_version: 1, payload_visibility: 'public', source_kind: 'synthetic-fixture', checkpoint_id: 'story-smoke-v2',
            season_id: 'WEB_MVP_TEST_SESSION', phase: 'NON_CANONICAL_TEST', date: '2030-01-01', time: '18:00', player_location: '도심 사무실',
            family: [
              {id:'player',name:'한준호',location:'도심 사무실',condition:'퇴근 준비 중'},
              {id:'wife',name:'서윤',location:'집',condition:'가족과 함께 있음'},
              {id:'son',name:'민석',location:'집',condition:'평온'},
              {id:'father',name:'정호',location:'집',condition:'평온'}
            ],
            resources:[{id:'communications',name:'통신',band:'불안정'},{id:'water',name:'물',band:'보통'}],
            base_capabilities:[{id:'home',name:'집',capabilities:['기본 생활']}],
            active_visible_pressure:'도심 정전과 통신 불안정이 동시에 시작됐다.', recent_visible_change:'창밖 여러 건물의 불이 동시에 꺼졌다.',
            current_scene:{id:'story-start',narrative:'퇴근 직전 사무실 전체가 갑자기 정전됐다. 창밖 여러 건물도 동시에 어두워지고 휴대전화 데이터 연결까지 불안정하다. 집에는 가족이 있다.',choices:[
              {id:1,label:'가족에게 먼저 전화한다',action:{id:'p1',label:'가족에게 먼저 전화한다',actors:['player'],exclusive_resources:[],proposal:{time_delta_min:0,moves:[],resource_changes:[],base_capability_changes:[],world_changes:[]}}},
              {id:2,label:'밖의 상황부터 확인한다',action:{id:'p2',label:'밖의 상황부터 확인한다',actors:['player'],exclusive_resources:[],proposal:{time_delta_min:0,moves:[],resource_changes:[],base_capability_changes:[],world_changes:[]}}}
            ],presentation_blocks:[]},
            committed_turn:{number:0,log:[{id:0,kind:'scene',text:'정전이 시작됐다.'}]},
            public_state:{version:1,season_id:'WEB_MVP_TEST_SESSION',scene_id:'story-start',clock:{day:1,date:'2030-01-01',time:'18:00',phase:'NON_CANONICAL_TEST'},party:{
              player:{name:'한준호',location:'도심 사무실',with:[],status:'퇴근 준비 중'},wife:{name:'서윤',location:'집',with:[],status:'가족과 함께 있음'},son:{name:'민석',location:'집',with:[],status:'평온'},father:{name:'정호',location:'집',with:[],status:'평온'}
            },vehicles:{},bases:{home:{name:'집',location:'도심',status:'정상',capabilities:['기본 생활']}},resources:{communications:{name:'통신',icon:'📡',band:'불안정'},water:{name:'물',icon:'💧',band:'보통'}},institutions:{},routes_known:{},active_actions:[],completed_actions:[],public_world:{outage_visible:true},last_change:{},renderer_flags:{show_status:true}}
          }

          async function run(label, input) {
            const started = Date.now()
            const response = await fetch(`${process.env.PREVIEW_GM_URL}/api/gm`, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({input,checkpoint}),signal:AbortSignal.timeout(20000)})
            const payload = await response.json()
            console.log(label, JSON.stringify({http:response.status,latency_ms:Date.now()-started,status:payload.status,failure:payload.diagnostic?.failure_category,actions:payload.proposal?.actions?.length,choices:payload.proposal?.next_choices?.length,family:payload.proposal?.family_reactions?.length,narrative:payload.proposal?.narrative,next_choices:payload.proposal?.next_choices?.map(x=>x.label)}))
            if (response.status !== 200 || payload.status !== 'proposal' || !payload.proposal?.narrative || (payload.proposal?.next_choices?.length ?? 0) < 2) process.exitCode = 1
          }

          await run('NUMBERED_STORY', {kind:'numbered-choice',choice_id:1})
          await run('FREE_STORY', {kind:'free-action',text:'휴대전화 손전등을 켜고 가족에게 전화하면서 계단으로 내려갈 준비를 한다'})
          NODE
