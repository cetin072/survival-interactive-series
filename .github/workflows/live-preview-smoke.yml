name: Temporary live preview AI smoke

on:
  push:
    branches: [feature/ai-gm-deepseek-provider]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_GM_URL: https://6a98076aa5770081cf4d4a59--survival-zero-ai-test.netlify.app/api/gm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/web/package-lock.json

      - name: Install web dependencies
        working-directory: engine/web
        run: npm ci

      - name: Create one-call live smoke test
        working-directory: engine/web
        run: |
          cat > src/runtime/livePreviewSmoke.temp.test.ts <<'EOF'
          import { expect, it } from 'vitest'
          import type { GMProvider, GMProviderResult } from './gmProvider'
          import { runGMProviderTurn } from './gmTurnRuntime'
          import { createWebMvpTestSession } from './webMvpTestSession'

          it('accepts one real Preview GM proposal and commits it only through the engine', async () => {
            const endpoint = process.env.PREVIEW_GM_URL
            if (!endpoint) throw new Error('LIVE_SMOKE_FAIL missing preview endpoint')

            const checkpoint = createWebMvpTestSession()
            const input = { kind: 'free-action' as const, text: '통신 상태를 확인하고 민석에게 현재 통신 점검 상황을 물어본다' }
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ input, checkpoint }),
            })

            let payload: any
            try {
              payload = await response.json()
            } catch {
              throw new Error(`LIVE_SMOKE_FAIL http=${response.status} non_json_response`)
            }

            if (!response.ok || payload?.status !== 'proposal') {
              const diagnostic = payload?.diagnostic ?? {}
              const fp = diagnostic?.response_fingerprint ?? {}
              throw new Error([
                'LIVE_SMOKE_FAIL',
                `http=${response.status}`,
                `status=${String(payload?.status ?? 'unknown')}`,
                `key_present=${String(diagnostic?.key_present ?? 'unknown')}`,
                `failure=${String(diagnostic?.failure_category ?? 'unknown')}`,
                `content_type=${String(fp?.message_content_type ?? 'unknown')}`,
                `upstream=${String(fp?.upstream_provider ?? 'unknown')}`,
              ].join(' '))
            }

            const liveResult: GMProviderResult = payload
            const provider: GMProvider = { proposeTurn: async () => liveResult }
            const next = await runGMProviderTurn(checkpoint, input, provider)
            const familyCount = Array.isArray(payload?.proposal?.family_reactions) ? payload.proposal.family_reactions.length : -1
            const actionCount = Array.isArray(payload?.proposal?.actions) ? payload.proposal.actions.length : -1
            const committed = next.current_scene.id === 'gm_turn_scene' && next.committed_turn.number === 1

            console.log([
              'LIVE_SMOKE_PASS',
              `http=${response.status}`,
              'proposal=true',
              `actions=${actionCount}`,
              `family_reactions=${familyCount}`,
              `turn=${next.committed_turn.number}`,
              `scene=${next.current_scene.id}`,
              `engine_commit=${String(committed)}`,
            ].join(' '))

            expect(committed).toBe(true)
            expect(actionCount).toBeGreaterThanOrEqual(0)
            expect(familyCount).toBeGreaterThanOrEqual(0)
          }, 30_000)
          EOF

      - name: Run exactly one live Preview smoke
        working-directory: engine/web
        run: npx vitest run src/runtime/livePreviewSmoke.temp.test.ts --reporter=verbose
