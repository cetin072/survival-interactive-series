name: Check linked Archive batch

# Dispatch is available only after this workflow reaches the default branch.
# No schedule, publication, database mutation or image generation is enabled here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-linked-batch-check
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Install pinned read-only exporter dependencies
        working-directory: archive/exporter
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check linked batch without publication
        working-directory: archive/exporter
        env:
          ARCHIVE_EXPORT_DATABASE_URL: ${{ secrets.ARCHIVE_EXPORT_DATABASE_URL }}
        run: node check-linked-batch.mjs --check
