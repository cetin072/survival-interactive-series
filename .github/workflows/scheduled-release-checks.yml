name: Scheduled release regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'archive/scripts/scheduled-netlify-release.mjs'
      - 'archive/scripts/one-time-approved-release-20261021.mjs'
      - 'archive/scripts/lib/one-time-approved-release-20261021.test.mjs'
      - 'archive/scripts/lib/scheduled-netlify-release.test.mjs'
      - 'archive/automation/release-policy.json'
      - 'archive/web/netlify.toml'
      - '.github/workflows/archive-production-release.yml'
      - '.github/workflows/scheduled-release-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test archive/scripts/lib/scheduled-netlify-release.test.mjs
      - run: node --test archive/scripts/lib/one-time-approved-release-20261021.test.mjs
