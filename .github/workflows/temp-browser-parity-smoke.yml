name: Temporary Browser Parity Smoke

on:
  push:
    branches:
      - feature/ai-gm-deepseek-provider
    paths:
      - '.github/workflows/temp-browser-parity-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: engine/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/web/package-lock.json
      - run: npm ci
      - name: Run exact browser-parity live preview turn
        env:
          LIVE_PREVIEW_GM_URL: https://6a9828c09dd2ed00089a3d59--survival-zero-ai-test.netlify.app
        run: npx vitest run src/runtime/livePreviewBrowserParity.test.ts --reporter=verbose
