name: Prepare Automation B render job

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afterfall-illustration-prep
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'cetin072/survival-interactive-series'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare one render job
        env:
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: node archive/scripts/prepare-illustration-render-job.mjs
