name: schedule probe

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record scheduler event
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          date -u
