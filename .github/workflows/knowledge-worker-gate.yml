name: Validate Knowledge worker gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'knowledge/content/briefs/**'
      - 'knowledge/content/candidates/**'
      - 'knowledge/content/evidence/**'
      - 'knowledge/content/topics.json'
      - 'knowledge/content/stories.json'
      - 'knowledge/automation/state.json'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: knowledge-worker-gate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      startsWith(github.head_ref, 'knowledge/worker/') &&
      !startsWith(github.head_ref, 'knowledge/worker/state-') &&
      contains(github.event.pull_request.body, 'knowledge-worker-phase-v1:PACKAGE_READY')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: archive/web
    steps:
      - name: Checkout exact Worker PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: archive/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Require exact PR base ancestry
        working-directory: .
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$PR_BASE_SHA^{commit}"
          test "$(git merge-base "$PR_BASE_SHA" HEAD)" = "$PR_BASE_SHA" || {
            echo "WORKER_BRANCH_NOT_BASED_ON_PR_BASE"
            exit 1
          }

      - name: Resolve exact single BRIEF target
        id: target
        working-directory: .
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mapfile -t ids < <(
            git diff --name-only "$PR_BASE_SHA"...HEAD |
              sed -n 's#^knowledge/content/briefs/\(K-[0-9][0-9]*\)\.json$#\1#p' |
              sort -u
          )
          test "${#ids[@]}" -eq 1 || {
            printf 'WORKER_BRIEF_TARGET_COUNT=%s:%s\n' "${#ids[@]}" "${ids[*]-}"
            exit 1
          }
          echo "brief=${ids[0]}" >> "$GITHUB_OUTPUT"

      - name: Run exact-head Knowledge validation
        run: |
          npm run knowledge:test
          npm run knowledge:check

      - name: Run exact-head release checker
        id: gate
        working-directory: .
        env:
          BRIEF_ID: ${{ steps.target.outputs.brief }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node archive/scripts/knowledge-release-check.mjs \
            --brief "$BRIEF_ID" \
            --base "$PR_BASE_SHA" \
            --head HEAD > "$RUNNER_TEMP/worker-release.json"
          cat "$RUNNER_TEMP/worker-release.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs'
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/worker-release.json', 'utf8'))
          if (result.content_only?.allowed !== true) throw new Error('WORKER_GATE_CONTENT_BOUNDARY')
          if (result.decision === 'AUTO_PUBLISH_ELIGIBLE') {
            if (result.requires_human !== false) throw new Error('WORKER_GATE_HUMAN_REVIEW_CONTRADICTION')
            if (!Array.isArray(result.reasons) || result.reasons.length !== 0) throw new Error('WORKER_GATE_REASONS_NOT_EMPTY')
            console.log('mode=auto')
            console.log('decision=AUTO_PUBLISH_ELIGIBLE')
          } else if (result.decision === 'HUMAN_REVIEW_REQUIRED' || (result.decision === 'HOLD' && result.requires_human === true)) {
            console.log('mode=human_review')
            console.log(`decision=${result.decision}`)
          } else {
            throw new Error(`WORKER_GATE_DECISION:${result.decision}`)
          }
          NODE

      - name: Enqueue exact-head human review
        if: steps.gate.outputs.mode == 'human_review'
        working-directory: .
        env:
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
          BRIEF_ID: ${{ steps.target.outputs.brief }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          node archive/scripts/knowledge-review-sync.mjs \
            --brief "$BRIEF_ID" \
            --base "$PR_BASE_SHA" \
            --head HEAD \
            --pr-number "$PR_NUMBER" \
            --pr-head-ref "$PR_HEAD_REF"

      - name: Record human-review queue marker on PR
        if: steps.gate.outputs.mode == 'human_review'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MARKER="<!-- knowledge-worker-human-review-v1:$HEAD_SHA -->"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate \
            --jq '.[].body' | grep -Fqx "$MARKER"; then
            echo "Human-review marker already exists."
          else
            gh pr comment "$PR_NUMBER" --body "$MARKER"
          fi

      - name: Record exact-head gate marker on PR
        if: steps.gate.outputs.mode == 'auto'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          MARKER="<!-- knowledge-worker-gate-v1:$HEAD_SHA:$PR_BASE_SHA:AUTO_PUBLISH_ELIGIBLE -->"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate \
            --jq '.[].body' | grep -Fqx "$MARKER"; then
            echo "Gate marker already exists."
          else
            gh pr comment "$PR_NUMBER" --body "$MARKER"
          fi

      - name: Check current-main freshness for automatic handoff
        if: steps.gate.outputs.mode == 'auto'
        id: freshness
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          echo "current_main=$CURRENT_MAIN" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_MAIN" != "$EXPECTED_BASE" ]; then
            echo "auto_handoff=false" >> "$GITHUB_OUTPUT"
            echo "reason=MAIN_MOVED" >> "$GITHUB_OUTPUT"
            echo "AUTO_HANDOFF=DEFERRED_MAIN_MOVED"
            exit 0
          fi

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/handoff-pr.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pr = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/handoff-pr.json', 'utf8'))
          if (pr.state !== 'open') throw new Error('HANDOFF_PR_NOT_OPEN')
          if (pr.draft !== true) throw new Error('HANDOFF_PR_NOT_DRAFT')
          if (pr.base?.ref !== 'main') throw new Error('HANDOFF_PR_BASE_NOT_MAIN')
          if (pr.base?.sha !== process.env.EXPECTED_BASE) throw new Error('HANDOFF_PR_BASE_CHANGED')
          if (pr.head?.sha !== process.env.EXPECTED_HEAD) throw new Error('HANDOFF_PR_HEAD_CHANGED')
          if (!pr.body?.includes('<!-- knowledge-worker-phase-v1:PACKAGE_READY -->')) throw new Error('HANDOFF_PACKAGE_PHASE_REQUIRED')
          const labels = new Set((pr.labels ?? []).map((item) => item.name))
          if (labels.has('knowledge-publish-prepare')) throw new Error('HANDOFF_PUBLICATION_LABEL_ALREADY_PRESENT')
          NODE
          echo "auto_handoff=true" >> "$GITHUB_OUTPUT"
          echo "reason=ELIGIBLE" >> "$GITHUB_OUTPUT"

      - name: Require automatic handoff credential
        if: steps.freshness.outputs.auto_handoff == 'true'
        working-directory: .
        env:
          AUTO_GH_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AUTO_GH_TOKEN" || {
            echo "ARCHIVE_GITHUB_TOKEN_REQUIRED"
            exit 1
          }

      - name: Automatic publication handoff
        if: steps.freshness.outputs.auto_handoff == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          PUBLICATION_LABEL: knowledge-publish-prepare
        run: |
          set -euo pipefail

          # Final race check immediately before mutating the PR.
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE" || {
            echo "AUTO_HANDOFF=DEFERRED_MAIN_MOVED_FINAL_CHECK"
            exit 0
          }

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pre-handoff-pr.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const pr = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/pre-handoff-pr.json', 'utf8'))
          if (pr.state !== 'open' || pr.draft !== true) throw new Error('HANDOFF_PR_STATE_CHANGED')
          if (pr.head?.sha !== process.env.EXPECTED_HEAD) throw new Error('HANDOFF_PR_HEAD_CHANGED')
          if (pr.base?.sha !== process.env.EXPECTED_BASE) throw new Error('HANDOFF_PR_BASE_CHANGED')
          const from = '<!-- knowledge-worker-phase-v1:PACKAGE_READY -->'
          const to = '<!-- knowledge-worker-phase-v1:PUBLICATION_HANDOFF -->'
          if (!pr.body?.includes(from)) throw new Error('HANDOFF_PACKAGE_PHASE_REQUIRED')
          const nextBody = pr.body.replace(from, to)
          writeFileSync(process.env.RUNNER_TEMP + '/handoff-update.json', JSON.stringify({ body: nextBody }))
          NODE

          # Make the PR reviewable first. ready_for_review no longer re-triggers the Worker gate.
          gh pr ready "$PR_NUMBER"

          # Move the phase before the publication label is applied.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --input "$RUNNER_TEMP/handoff-update.json" > "$RUNNER_TEMP/handoff-updated-pr.json"

          # Recheck current main one last time. If it moved during the two PR mutations,
          # do not start publication; the Scheduled Worker will sync the branch later.
          git fetch origin main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_BASE" ]; then
            echo "AUTO_HANDOFF=DEFERRED_MAIN_MOVED_AFTER_PHASE"
            exit 0
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
            -f "labels[]=$PUBLICATION_LABEL" > "$RUNNER_TEMP/handoff-label.json"

          PUBLICATION_MARKER="<!-- knowledge-worker-publication-v1:$EXPECTED_HEAD -->"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate \
            --jq '.[].body' | grep -Fqx "$PUBLICATION_MARKER"; then
            echo "Publication marker already exists."
          else
            gh pr comment "$PR_NUMBER" --body "$PUBLICATION_MARKER"
          fi

          echo "AUTO_HANDOFF=PUBLICATION_INITIATED"
