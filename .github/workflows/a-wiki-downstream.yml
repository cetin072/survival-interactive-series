name: A-Wiki downstream public archive

on:
  pull_request:
    paths:
      - 'archive/scripts/lib/wiki-semantic-jobs*'
      - 'archive/scripts/lib/wiki-fact-extractor*'
      - 'archive/scripts/lib/wiki-fact-finalizer*'
      - 'archive/scripts/lib/fixtures/wiki-fact-results-v1.json'
      - 'archive/scripts/run-wiki-fact-extractor.mjs'
      - 'archive/scripts/run-wiki-fact-finalizer.mjs'
      - 'docs/automation/A_WIKI_FACT_WORKER_V1.md'
      - 'docs/automation/A_WIKI_FACT_FINALIZER_PLAN_V1.md'
      - 'archive/scripts/run-wiki-automation.mjs'
      - 'archive/content/public-facts/C03-AFTERFALL/S03/AWIKI_SESSION_*.json'
      - 'archive/content/public-facts/C03-AFTERFALL/S03/receipts/AWIKI_SESSION_*.json'
      - '.github/workflows/a-wiki-downstream.yml'
  push:
    branches: [main]
    paths:
      - 'archive/content/transcripts/C03-AFTERFALL/S03/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a-wiki-downstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-wiki-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate and build A-Wiki projection
        run: |
          node --test archive/scripts/lib/publication-graph.test.mjs archive/scripts/lib/wiki-semantic-jobs.test.mjs archive/scripts/lib/wiki-fact-extractor.test.mjs archive/scripts/lib/wiki-fact-finalizer.test.mjs
          node archive/scripts/run-wiki-automation.mjs --prepare > a-wiki-fact-job.json
          node archive/scripts/run-wiki-automation.mjs --check > a-wiki-check.json
          node archive/scripts/run-wiki-automation.mjs --apply > a-wiki-apply.json
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises'
          const results = await Promise.all(['a-wiki-check.json', 'a-wiki-apply.json'].map(async (path) => ({ path, ...JSON.parse(await readFile(path, 'utf8')) })))
          const lines = ['## A-Wiki downstream result', '']
          for (const result of results) {
            const changed = result.graph_changed ?? (result.path === 'a-wiki-apply.json' && result.status === 'UPDATED')
            lines.push(`- **${result.path}**: ${result.status}; source ${result.source_session ?? 'unknown'}; reason ${result.reason ?? 'none'}; graph changed ${changed}`)
            if (result.status === 'HUMAN_REVIEW') console.log(`::warning::A-Wiki HUMAN_REVIEW for ${result.source_session ?? 'unknown'}: ${result.reason}`)
          }
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`)
          NODE

      - name: Publish review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-wiki-public-graph-${{ github.sha }}
          path: |
            a-wiki-check.json
            a-wiki-apply.json
            a-wiki-fact-job.json
            archive/content/public-facts/C03-AFTERFALL/S03/AWIKI_SESSION_*.json
            archive/content/public-facts/C03-AFTERFALL/S03/receipts/AWIKI_SESSION_*.json
            archive/content/graphs/C03-AFTERFALL/GRAPH.json
          if-no-files-found: ignore
          retention-days: 30
