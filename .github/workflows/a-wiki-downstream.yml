name: A-Wiki downstream public archive

on:
  push:
    branches: [main]
    paths:
      - 'archive/content/transcripts/C03-AFTERFALL/S03/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a-wiki-downstream
  cancel-in-progress: false

jobs:
  public-wiki-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate and build A-Wiki projection
        run: |
          node --test archive/scripts/lib/publication-graph.test.mjs archive/scripts/lib/wiki-semantic-jobs.test.mjs
          node archive/scripts/run-wiki-automation.mjs --check
          node archive/scripts/run-wiki-automation.mjs --apply

      - name: Publish review artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-wiki-public-graph-${{ github.sha }}
          path: |
            archive/content/public-facts/C03-AFTERFALL/S03/AWIKI_SESSION_*.json
            archive/content/graphs/C03-AFTERFALL/GRAPH.json
          if-no-files-found: error
          retention-days: 30
