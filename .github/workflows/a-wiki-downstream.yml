name: A-Wiki downstream public archive

on:
  pull_request:
    paths:
      - 'archive/scripts/lib/wiki-semantic-jobs*'
      - 'archive/scripts/lib/wiki-fact-extractor*'
      - 'archive/scripts/lib/wiki-fact-finalizer*'
      - 'archive/scripts/lib/fixtures/wiki-fact-results-v1.json'
      - 'archive/scripts/run-wiki-fact-extractor.mjs'
      - 'archive/scripts/run-wiki-fact-finalizer.mjs'
      - 'docs/automation/A_WIKI_FACT_WORKER_V1.md'
      - 'docs/automation/A_WIKI_FACT_FINALIZER_PLAN_V1.md'
      - 'archive/scripts/run-wiki-automation.mjs'
      - 'archive/content/public-facts/C03-AFTERFALL/S*/AWIKI_SESSION_*.json'
      - 'archive/content/public-facts/C03-AFTERFALL/S*/receipts/AWIKI_SESSION_*.json'
      - '.github/workflows/a-wiki-downstream.yml'
  push:
    branches: [main]
    paths:
      - 'archive/content/transcripts/C03-AFTERFALL/S*/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a-wiki-downstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-wiki-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate A-Wiki immutable source contracts
        run: |
          node --test archive/scripts/lib/publication-graph.test.mjs archive/scripts/lib/wiki-semantic-jobs.test.mjs archive/scripts/lib/wiki-fact-extractor.test.mjs archive/scripts/lib/wiki-fact-finalizer.test.mjs

      # A PR is not a live A-Wiki publication job. Verify the exact current
      # source gate read-only; the native handoff workflow owns PR semantics.
      - name: Verify read-only PR source gate
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile, readdir, writeFile } from 'node:fs/promises'
          import { resolve } from 'node:path'
          import { discoverWikiSources } from './archive/scripts/lib/wiki-semantic-jobs.mjs'
          const root = process.cwd()
          let status = 'VALID_APPLIED_SOURCES'
          let reason = 'PR_SOURCE_CONTRACTS_ONLY'
          let incomplete = []
          try {
            await discoverWikiSources(root)
          } catch (error) {
            if (error.message !== 'WIKI_PUBLIC_ANCHOR_NOT_APPLIED') throw error
            // Preserve a real BLOCKED state, never reclassify an un-applied
            // GM turn as applied or run --check/--apply on that source.
            const transcriptRoot = resolve(root, 'archive/content/transcripts/C03-AFTERFALL')
            for (const folder of await readdir(transcriptRoot, { withFileTypes: true })) {
              if (!folder.isDirectory() || !/^S[0-9]{2,3}$/.test(folder.name) || Number(folder.name.slice(1)) < 3) continue
              let manifest
              try { manifest = JSON.parse(await readFile(resolve(transcriptRoot, folder.name, 'MANIFEST.json'), 'utf8')) }
              catch (e) { if (e.code === 'ENOENT') continue; throw e }
              for (const session of manifest.sessions ?? []) {
                if (session.visibility !== 'PUBLIC_ARCHIVE' || !session.atomic_pairing_complete) continue
                const source = JSON.parse(await readFile(resolve(transcriptRoot, folder.name, session.source_manifest), 'utf8'))
                const last = source.content_sha256?.at(-1)
                if (last?.role === 'GM' && last.state_link?.outcome !== 'APPLIED') incomplete.push(folder.name + '/' + session.session_id)
              }
            }
            if (!incomplete.length) throw error
            status = 'BLOCKED_NOT_APPLIED'
            reason = error.message
            console.log('::warning::A-Wiki source is BLOCKED (no applied GM anchor): ' + incomplete.join(', '))
          }
          const result = { status, reason, incomplete_sources: incomplete, graph_changed: false,
            raw_changed: false, book_changed: false, source_marked_processed: false,
            database_writes: 0, site_publications: 0, pr_validation_only: true }
          for (const path of ['a-wiki-fact-job.json', 'a-wiki-check.json', 'a-wiki-apply.json'])
            await writeFile(path, JSON.stringify(result, null, 2) + '\n')
          await appendFile(process.env.GITHUB_STEP_SUMMARY,
            '## A-Wiki read-only PR source gate\n\n' +
            '- Source state: **' + status + '**; reason: ' + reason + '\n' +
            '- Incomplete sources: ' + (incomplete.join(', ') || 'none') + '\n' +
            '- Legacy CLI apply: **NOT RUN ON PR**. Native CI and source contracts are tested.\n')
          NODE

      # The legacy command actually processes a cold-archive source. Keep
      # its fail-closed error/exit behavior for real push/manual workflows.
      - name: Run legacy A-Wiki publication smoke on source events
        if: github.event_name != 'pull_request'
        run: |
          node archive/scripts/run-wiki-automation.mjs --prepare > a-wiki-fact-job.json
          node archive/scripts/run-wiki-automation.mjs --check > a-wiki-check.json
          node archive/scripts/run-wiki-automation.mjs --apply > a-wiki-apply.json
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises'
          const results = await Promise.all(['a-wiki-check.json', 'a-wiki-apply.json'].map(async (path) => ({ path, ...JSON.parse(await readFile(path, 'utf8')) })))
          const lines = ['## A-Wiki downstream result', '']
          for (const result of results) {
            const changed = result.graph_changed ?? (result.path === 'a-wiki-apply.json' && result.status === 'UPDATED')
            lines.push(`- **${result.path}**: ${result.status}; source ${result.source_session ?? 'unknown'}; reason ${result.reason ?? 'none'}; graph changed ${changed}`)
            if (result.status === 'HUMAN_REVIEW') console.log(`::warning::A-Wiki HUMAN_REVIEW for ${result.source_session ?? 'unknown'}: ${result.reason}`)
          }
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`)
          NODE

      - name: Publish review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-wiki-public-graph-${{ github.sha }}
          path: |
            a-wiki-check.json
            a-wiki-apply.json
            a-wiki-fact-job.json
            archive/content/public-facts/C03-AFTERFALL/S*/AWIKI_SESSION_*.json
            archive/content/public-facts/C03-AFTERFALL/S*/receipts/AWIKI_SESSION_*.json
            archive/content/graphs/C03-AFTERFALL/GRAPH.json
          if-no-files-found: ignore
          retention-days: 30
