name: Store Automation B illustration vault

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Automation B render job id
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: afterfall-illustration-vault-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  vault:
    if: github.repository == 'cetin072/survival-interactive-series'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PNG validator
        run: 'python -m pip install --only-binary=:all: Pillow==12.3.0'
      - name: Store exact reviewed render in private 30-day vault
        env:
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: python archive/scripts/illustration_vault.py archive --job-id "${{ inputs.job_id }}"
