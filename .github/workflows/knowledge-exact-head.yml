name: Validate Knowledge exact publication head

on:
  workflow_dispatch:
    inputs:
      brief_id:
        description: Exact Knowledge BRIEF ID
        required: true
        type: string
      expected_sha:
        description: Exact prepared publication commit SHA
        required: true
        type: string
      pr_number:
        description: Source Knowledge PR number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: knowledge-exact-head-${{ inputs.pr_number }}-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/web
    steps:
      - name: Checkout exact prepared SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: archive/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify exact checked-out SHA and fetch main
        working-directory: .
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo "Checked-out SHA does not match expected prepared SHA."
            exit 1
          }
          git fetch origin main:refs/remotes/origin/main
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Prepared publication head is not based on current main."
            exit 1
          }

      - name: Verify target BRIEF is PUBLISHED and low-risk eligible
        working-directory: .
        env:
          BRIEF_ID: ${{ inputs.brief_id }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const id = process.env.BRIEF_ID
          if (!/^K-\d+$/.test(id)) throw new Error('invalid BRIEF id')
          const brief = JSON.parse(readFileSync(`knowledge/content/briefs/${id}.json`, 'utf8'))
          if (brief.id !== id) throw new Error('BRIEF identity mismatch')
          if (brief.status !== 'PUBLISHED') throw new Error(`expected PUBLISHED, got ${brief.status}`)
          if (brief.risk_level !== 'LOW') throw new Error('expected LOW risk')
          if (brief.publication_policy !== 'AUTO_LOW_RISK') throw new Error('expected AUTO_LOW_RISK')
          if (brief.semantic_qa_status !== 'PASS') throw new Error('expected semantic QA PASS')
          console.log(JSON.stringify({ id, slug: brief.slug, status: brief.status }))
          NODE

      - name: Run exact-head Knowledge tests and site build
        run: |
          npm run knowledge:test
          npm run knowledge:check
          npm run build

      - name: Re-run release gate against exact prepared SHA
        id: gate
        working-directory: .
        env:
          BRIEF_ID: ${{ inputs.brief_id }}
        run: |
          node archive/scripts/knowledge-release-check.mjs \
            --brief "$BRIEF_ID" \
            --base origin/main \
            --head HEAD > "$RUNNER_TEMP/release.json"
          cat "$RUNNER_TEMP/release.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/release.json', 'utf8'))
          const allowed = new Set(['WOULD_AUTO_PUBLISH', 'AUTO_PUBLISH_ELIGIBLE'])
          if (!allowed.has(result.decision)) throw new Error(`release decision not eligible: ${result.decision}`)
          if (result.requires_human !== false) throw new Error('human review required')
          if (result.content_only?.allowed !== true) throw new Error('content-only boundary failed')
          if (!Array.isArray(result.reasons) || result.reasons.length !== 0) throw new Error('release reasons not empty')
          console.log('EXACT_HEAD_RELEASE_GATE=PASS')
          NODE

      - name: Verify expected article/index/sitemap files
        working-directory: .
        env:
          BRIEF_ID: ${{ inputs.brief_id }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs'
          const id = process.env.BRIEF_ID
          const brief = JSON.parse(readFileSync(`knowledge/content/briefs/${id}.json`, 'utf8'))
          const article = `archive/web/public/knowledge/${brief.slug}/index.html`
          if (!existsSync(article)) throw new Error('article page missing')
          const index = readFileSync('archive/web/public/knowledge/index.html', 'utf8')
          const sitemap = readFileSync('archive/web/public/sitemap.xml', 'utf8')
          const path = `/knowledge/${brief.slug}/`
          if (!index.includes(path)) throw new Error('Knowledge index missing article')
          if (!sitemap.includes(path)) throw new Error('sitemap missing article')
          console.log(JSON.stringify({ article, path }))
          NODE

      - name: Resolve publication authority
        id: authority
        working-directory: .
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs'
          const config = JSON.parse(readFileSync('knowledge/automation/config.json', 'utf8'))
          const enabled = config.publication_mode === 'AUTO_LOW_RISK' && config.auto_publish_enabled === true
          console.log(`auto_publish=${enabled ? 'true' : 'false'}`)
          NODE

      - name: Resolve C3 durable job binding
        id: c3
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/c3-pr.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs'
          const pr = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/c3-pr.json', 'utf8'))
          if (pr.head?.sha !== process.env.EXPECTED_SHA) throw new Error('C3_PR_HEAD_CHANGED')
          const match = String(pr.body ?? '').match(/<!-- knowledge-semantic-job-v1:([a-f0-9-]{36}) -->/i)
          if (!match) {
            console.log('bound=false')
            process.exit(0)
          }
          console.log('bound=true')
          console.log(`job_id=${match[1].toLowerCase()}`)
          console.log(`head_ref=${pr.head.ref}`)
          NODE

      - name: Persist exact C3 publication head
        if: steps.c3.outputs.bound == 'true'
        working-directory: .
        env:
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ steps.c3.outputs.job_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ steps.c3.outputs.head_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.ARCHIVE_SUPABASE_URL
          const key = process.env.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY
          if (!url || !key) throw new Error('C3_SUPABASE_CREDENTIALS_REQUIRED')
          const response = await fetch(`${url.replace(/\/$/, '')}/rest/v1/rpc/archive_knowledge_semantic_job_update`, {
            method: 'POST',
            headers: {
              apikey: key,
              authorization: `Bearer ${key}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              p_job_id: process.env.JOB_ID,
              p_expected_status: 'PR_OPEN',
              p_status: 'PR_OPEN',
              p_blocker_code: null,
              p_blocker_stage: null,
              p_pr_number: Number(process.env.PR_NUMBER),
              p_head_ref: process.env.HEAD_REF,
              p_head_sha: process.env.EXPECTED_SHA,
              p_merge_sha: null,
            }),
          })
          const text = await response.text()
          if (!response.ok) throw new Error(`C3_LEDGER_UPDATE_HTTP_${response.status}:${text}`)
          const result = JSON.parse(text)
          if (result?.status !== 'PR_OPEN') throw new Error(`C3_LEDGER_UPDATE_${result?.status ?? 'INVALID'}`)
          console.log(JSON.stringify({ status: result.status, job_id: result.job_id, head_sha: process.env.EXPECTED_SHA }))
          NODE

      - name: Record SHADOW exact-head validation on PR
        if: steps.authority.outputs.auto_publish != 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRIEF_ID: ${{ inputs.brief_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          BODY="$(printf 'Exact publication-head validation PASS for `%s` at `%s`. Knowledge tests/check/build, release gate, article/index/sitemap verification all passed. SHADOW mode: no merge or Production publication was performed.' "$BRIEF_ID" "$EXPECTED_SHA")"
          gh pr comment "$PR_NUMBER" --body "$BODY"

      - name: Require AUTO publication merge credential
        if: steps.authority.outputs.auto_publish == 'true'
        working-directory: .
        env:
          AUTO_GH_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
        run: |
          test -n "$AUTO_GH_TOKEN" || { echo "ARCHIVE_GITHUB_TOKEN_REQUIRED"; exit 1; }

      - name: Recheck exact PR head and merge
        if: steps.authority.outputs.auto_publish == 'true'
        id: merge
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          test "$(git merge-base origin/main "$EXPECTED_SHA")" = "$(git rev-parse origin/main)" || {
            echo "main changed after exact-head validation; refusing merge."
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pr = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/pr.json', 'utf8'))
          if (pr.state !== 'open') throw new Error('PR_NOT_OPEN')
          if (pr.base?.ref !== 'main') throw new Error('PR_BASE_NOT_MAIN')
          if (pr.head?.sha !== process.env.EXPECTED_SHA) throw new Error('PR_HEAD_CHANGED')
          NODE
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$EXPECTED_SHA" > "$RUNNER_TEMP/merge.json"
          cat "$RUNNER_TEMP/merge.json"
          MERGE_SHA="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/merge.json', 'utf8'))
          if (result.merged !== true || !/^[a-f0-9]{40}$/.test(result.sha ?? '')) throw new Error('AUTO_MERGE_FAILED')
          process.stdout.write(result.sha)
          NODE
          )"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Record batched Production handoff
        if: steps.authority.outputs.auto_publish == 'true'
        working-directory: .
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          test -n "$MERGE_SHA"
          echo "PRODUCTION_RELEASE=QUEUED"
          echo "MERGE_SHA=$MERGE_SHA"
          echo "Production is verified by the batched Archive release workflow, not by each Knowledge merge."

      - name: Record AUTO publication success on PR
        if: steps.authority.outputs.auto_publish == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRIEF_ID: ${{ inputs.brief_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          BODY="$(printf 'AUTO content merge PASS for `%s`. Prepared head `%s` passed exact-head validation and merged as `%s`. Netlify Production is queued for the batched Archive release gate; that gate will verify the exact release SHA before considering the batch published.' "$BRIEF_ID" "$EXPECTED_SHA" "$MERGE_SHA")"
          gh pr comment "$PR_NUMBER" --body "$BODY"
