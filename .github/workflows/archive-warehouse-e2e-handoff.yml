name: Trusted illustration registry readback diagnostic

on:
  push:
    branches:
      - codex/illustration-automation-b
    paths:
      - .github/workflows/archive-warehouse-e2e-handoff.yml
      - archive/scripts/illustration_storage_handoff.py
      - archive/content/visuals/C03-AFTERFALL/ILLUSTRATION_E2E_WAREHOUSE.json

permissions:
  contents: read

concurrency:
  group: illustration-registry-readback-diagnostic
  cancel-in-progress: false

jobs:
  registry-readback-diagnostic:
    if: github.repository == 'cetin072/survival-interactive-series' && github.ref == 'refs/heads/codex/illustration-automation-b'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check illustration identity contract offline
        run: python archive/scripts/test_illustration_storage_handoff.py
      - name: Read back existing warehouse registry row and report HTTP response
        env:
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: python archive/scripts/illustration_storage_handoff.py --registry-diagnostic --identity archive/content/visuals/C03-AFTERFALL/ILLUSTRATION_E2E_WAREHOUSE.json
