name: One-image private Archive illustration handoff

on:
  push:
    branches:
      - codex/illustration-e2e-warehouse-v1
    paths:
      - .github/workflows/archive-warehouse-e2e-handoff.yml
      - .github/warehouse-e2e-upload-public.pem
      - archive/scripts/illustration_storage_handoff.py
      - archive/content/visuals/C03-AFTERFALL/ILLUSTRATION_E2E_WAREHOUSE.json

permissions:
  contents: read

concurrency:
  group: warehouse-e2e-private-handoff
  cancel-in-progress: false

jobs:
  private-handoff:
    if: github.repository == 'cetin072/survival-interactive-series' && github.ref == 'refs/heads/codex/illustration-e2e-warehouse-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned envelope library
        run: 'python -m pip install --only-binary=:all: cryptography==50.0.1'
      - name: Check one-image identity and registry binding offline
        run: python archive/scripts/test_illustration_storage_handoff.py
      - name: Issue one-object encrypted upload token
        env:
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: python archive/scripts/illustration_storage_handoff.py --issue --envelope "$RUNNER_TEMP/warehouse-signed-upload.json"
      - name: Keep only encrypted token material for the local one-time upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-signed-upload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/warehouse-signed-upload.json
          if-no-files-found: warn
          retention-days: 1
      - name: Verify private readback and register one READY visual
        env:
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: python archive/scripts/illustration_storage_handoff.py --verify-register
